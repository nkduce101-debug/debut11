<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나만의 데뷔조 만들기</title>
<!-- 화면 캡처 및 이미지 저장을 위한 라이브러리 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  /* 모바일 화면 넘어감 방지 (Box-sizing 적용) */
  * { box-sizing: border-box; }
  
  body { font-family: 'Pretendard', -apple-system, sans-serif; text-align: center; background-color: #fff3e0; margin: 0; padding: 10px; }
  h1 { color: #e65100; display: flex; align-items: center; justify-content: center; font-size: 1.5em; margin: 10px 0; }
  
  /* 귤 단면 일러스트 크기 및 위치 조정 */
  .tangerine-icon { width: 28px; height: 28px; margin: 0 6px; }

  .container { width: 100%; max-width: 800px; margin: 0 auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  /* 101명 그리드 설정 (모바일 최적화 및 이름 공간 확보) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px 6px; margin-top: 15px; max-height: 52vh; overflow-y: auto; padding: 8px 5px; border: 1px solid #ddd; border-radius: 10px; }
  
  /* 사진 + 이름 묶음 카드 */
  .trainee-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .trainee-img { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; transition: 0.2s; object-fit: cover; background: #f5f5f5; }
  .trainee-item:hover .trainee-img { transform: scale(1.05); }
  .trainee-item.selected .trainee-img { border-color: #ff9800; transform: scale(1.08); background: #fff8e1; }
  
  /* 사진 아래 이름 스타일 */
  .trainee-name { font-size: 11px; color: #333; margin-top: 4px; font-weight: 500; word-break: keep-all; line-height: 1.2; }
  .trainee-item.selected .trainee-name { color: #e65100; font-weight: bold; }
  
  /* 카운터 및 버튼 */
  .status { margin: 15px 0; font-size: 1.1em; font-weight: bold; color: #333; }
  .btn { padding: 10px 16px; font-size: 1em; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; margin: 5px; width: 100%; max-width: 300px; }
  .btn-submit { background-color: #e0e0e0; color: #9e9e9e; pointer-events: none; }
  .btn-submit.active { background-color: #ff9800; color: white; pointer-events: auto; }
  .btn-submit.active:hover { background-color: #f57c00; }
  
  /* 결과 화면 */
  #result-area { display: none; }
  .pyramid { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 5px; background: #fff8e1; border-radius: 15px; width: 100%; }
  .row { display: flex; justify-content: center; gap: 6px; width: 100%; }
  .row-wrap { display: flex; flex-direction: column; align-items: center; width: 21vw; max-width: 85px; }
  
  /* 결과 이미지 기본 크기 */
  .row img { width: 16vw; max-width: 70px; height: 16vw; max-height: 70px; border-radius: 50%; border: 3px solid #ffb74d; object-fit: cover; background: white; }
  
  /* 센터 전용 이미지 크기 1.5배 확대 */
  .row img.center-img { width: 24vw; max-width: 105px; height: 24vw; max-height: 105px; border-width: 4px; }
  
  .result-name { font-size: 11px; font-weight: bold; color: #333; margin-top: 4px; word-break: keep-all; line-height: 1.2; }
  .row-wrap.center-wrap .result-name { font-size: 13px; color: #e65100; margin-top: 6px; } /* 센터 이름도 조금 더 크게 */
  
  /* 사진 위 CENTER 라벨 스타일 */
  .center-label { text-align: center; font-weight: bold; color: #e65100; margin-bottom: 5px; font-size: 0.9em; white-space: nowrap; }
  
  /* 공유 및 액션 버튼 래퍼 */
  .action-buttons { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
  .btn-save { background-color: #4CAF50; color: white; }
  .btn-twitter { background-color: #000000; color: white; } 
</style>
</head>
<body>

<!-- 귤 단면 일러스트 SVG -->
<svg style="display: none;">
  <symbol id="tangerine-svg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="#FF9800" />
    <circle cx="50" cy="50" r="40" fill="#FFF3E0" />
    <path d="M50 50 L50 13 A37 37 0 0 1 85 36 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <path d="M50 50 L85 36 A37 37 0 0 1 85 64 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <path d="M50 50 L85 64 A37 37 0 0 1 50 87 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <path d="M50 50 L50 87 A37 37 0 0 1 15 64 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <path d="M50 50 L15 64 A37 37 0 0 1 15 36 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <path d="M50 50 L15 36 A37 37 0 0 1 50 13 Z" fill="#FFB74D" stroke="#FFF3E0" stroke-width="2" />
    <circle cx="50" cy="50" r="5" fill="#FFF3E0" />
  </symbol>
</svg>

<!-- 1단계: 선택 화면 -->
<div class="container" id="main-container">
  <h1>
    <svg class="tangerine-icon"><use href="#tangerine-svg"></use></svg>
    나만의 데뷔조 만들기
    <svg class="tangerine-icon"><use href="#tangerine-svg"></use></svg>
  </h1>
  <p style="font-size: 0.9em; color: #555;">101명의 후보 중 당신의 마음을 훔친 11명을 선택하세요!</p>
  
  <div class="status">선택: <span id="count" style="color: #ff9800;">0</span> / 11</div>
  <button id="submit-btn" class="btn btn-submit">11명 선택 필요</button>
  
  <div class="grid" id="trainee-grid"></div>
</div>

<!-- 2단계: 결과 화면 -->
<div class="container" id="result-area">
  <h1>
    <svg class="tangerine-icon"><use href="#tangerine-svg"></use></svg>
    나만의 픽! 탑 11
    <svg class="tangerine-icon"><use href="#tangerine-svg"></use></svg>
  </h1>
  <div class="pyramid" id="capture-area">
    <h2 style="color: #e65100; margin: 0 0 12px 0; font-size: 1.3em;">나만의 닏경</h2>
    <div class="row" id="row1"></div> <!-- 1명 (센터) -->
    <div class="row" id="row2"></div> <!-- 3명 -->
    <div class="row" id="row3"></div> <!-- 3명 -->
    <div class="row" id="row4"></div> <!-- 4명 -->
  </div>
  
  <div class="action-buttons">
    <button class="btn btn-save" onclick="saveImage()">⬇️ 이미지로 저장</button>
    <button class="btn btn-twitter" onclick="shareTwitter()">𝕏 트위터 공유</button>
    <button class="btn" style="background:#ddd; color:#333;" onclick="location.reload()">🔄 다시 하기</button>
  </div>
</div>

<script>
  // ★ 아래 101개의 이름을 실제 이름으로 순서대로 수정해 주세요 ★
  const traineeNames = [
    "후보 1", "후보 2", "후보 3", "후보 4", "후보 5", "후보 6", "후보 7", "후보 8", "후보 9", "후보 10",
    "후보 11", "후보 12", "후보 13", "후보 14", "후보 15", "후보 16", "후보 17", "후보 18", "후보 19", "후보 20",
    "후보 21", "후보 22", "후보 23", "후보 24", "후보 25", "후보 26", "후보 27", "후보 28", "후보 29", "후보 30",
    "후보 31", "후보 32", "후보 33", "후보 34", "후보 35", "후보 36", "후보 37", "후보 38", "후보 39", "후보 40",
    "후보 41", "후보 42", "후보 43", "후보 44", "후보 45", "후보 46", "후보 47", "후보 48", "후보 49", "후보 50",
    "후보 51", "후보 52", "후보 53", "후보 54", "후보 55", "후보 56", "후보 57", "후보 58", "후보 59", "후보 60",
    "후보 61", "후보 62", "후보 63", "후보 64", "후보 65", "후보 66", "후보 67", "후보 68", "후보 69", "후보 70",
    "후보 71", "후보 72", "후보 73", "후보 74", "후보 75", "후보 76", "후보 77", "후보 78", "후보 79", "후보 80",
    "후보 81", "후보 82", "후보 83", "후보 84", "후보 85", "후보 86", "후보 87", "후보 88", "후보 89", "후보 90",
    "후보 91", "후보 92", "후보 93", "후보 94", "후보 95", "후보 96", "후보 97", "후보 98", "후보 99", "후보 100",
    "후보 101"
  ];

  const grid = document.getElementById('trainee-grid');
  const countDisplay = document.getElementById('count');
  const submitBtn = document.getElementById('submit-btn');
  const mainContainer = document.getElementById('main-container');
  const resultArea = document.getElementById('result-area');
  let selected = [];

  for (let i = 1; i <= 101; i++) {
    const name = traineeNames[i - 1] || `후보 ${i}`;
    
    const item = document.createElement('div');
    item.className = 'trainee-item';
    item.dataset.id = i;
    item.dataset.name = name;

    const img = document.createElement('img');
    // ★ 실제 사진 적용 시 아래 img.src 부분을 교체해 주세요 (예: `./1 (${i}).jpg` 또는 `./${i}.jpg`) ★
    img.src = `./후보${i}.jpg`;
    img.className = 'trainee-img';

    const label = document.createElement('div');
    label.className = 'trainee-name';
    label.innerText = name;

    item.appendChild(img);
    item.appendChild(label);
    item.onclick = () => toggleSelection(item);
    grid.appendChild(item);
  }

  function toggleSelection(item) {
    const id = item.dataset.id;
    const name = item.dataset.name;
    const src = item.querySelector('img').src;
    const index = selected.findIndex(entry => entry.id === id);

    if (index > -1) {
      selected.splice(index, 1);
      item.classList.remove('selected');
    } else {
      if (selected.length >= 11) {
        alert('이미 11명을 모두 선택했습니다!');
        return;
      }
      selected.push({ id, name, src });
      item.classList.add('selected');
    }
    updateStatus();
  }

  function updateStatus() {
    countDisplay.innerText = selected.length;
    if (selected.length === 11) {
      submitBtn.classList.add('active');
      submitBtn.innerText = "결과 보기!";
    } else {
      submitBtn.classList.remove('active');
      submitBtn.innerText = `${11 - selected.length}명 더 선택 필요`;
    }
  }

  submitBtn.onclick = () => {
    if (selected.length !== 11) return;
    
    mainContainer.style.display = 'none';
    resultArea.style.display = 'block';

    const layouts = [1, 3, 3, 4];
    let currentIndex = 0;

    layouts.forEach((count, rowIndex) => {
      const row = document.getElementById(`row${rowIndex + 1}`);
      for (let i = 0; i < count; i++) {
        if (currentIndex >= 11) break;
        
        const person = selected[currentIndex];
        const wrap = document.createElement('div');
        wrap.className = 'row-wrap';

        // 센터(첫 번째 줄) 전용 클래스 및 요소 추가
        if (rowIndex === 0) {
          wrap.style.width = 'auto';
          wrap.classList.add('center-wrap');
          const label = document.createElement('div');
          label.className = 'center-label';
          label.innerText = '👑 CENTER 👑';
          wrap.appendChild(label);
        }
        
        const img = document.createElement('img');
        img.src = person.src;
        // 센터인 경우 사진에 center-img 클래스 추가하여 1.5배 확대
        if (rowIndex === 0) {
          img.classList.add('center-img');
        }
        wrap.appendChild(img);

        const nameTag = document.createElement('div');
        nameTag.className = 'result-name';
        nameTag.innerText = person.name;
        wrap.appendChild(nameTag);
        
        row.appendChild(wrap);
        currentIndex++;
      }
    });
  };

  function saveImage() {
    const captureArea = document.getElementById('capture-area');
    html2canvas(captureArea, { backgroundColor: '#fff8e1', scale: 3 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'my_top11_debut_group.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function shareTwitter() {
    const text = encodeURIComponent("🍊 나만의 데뷔조 11명을 완성했습니다! 🍊 여러분의 픽은 누구인가요?\n#나만의데뷔조 #TOP11");
    const url = encodeURIComponent(window.location.href); 
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
  }
</script>
</body>
</html>
